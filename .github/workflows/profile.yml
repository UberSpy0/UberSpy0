name: Refresh live cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "profile.json"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub data, rebuild cards and README
        run: python scripts/build.py --fetch
        env:
          # A read-only PAT in PROFILE_TOKEN adds private activity; names stay hidden.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          git diff --cached --quiet || git commit -m "chore: refresh live cards"
          git push
