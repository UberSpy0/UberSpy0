<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" width="460" height="76" role="img" aria-label="Message me on Telegram: @fab_butt">
<title>Telegram @fab_butt</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.a{font:700 20px 'Space Grotesk',sans-serif;fill:#E6EAF5}
.b{font:500 13px 'JetBrains Mono',monospace;fill:#38BDF8}
.sheen{animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-160px)}100%{transform:translateX(500px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(1.5);opacity:0}}
.edge{stroke-dasharray:.22 .78;animation:run 5s linear infinite}
@keyframes run{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
