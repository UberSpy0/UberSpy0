<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-label="Projects">
<title>Projects</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.t{font:700 32px 'Space Grotesk',sans-serif;fill:#E6EAF5;letter-spacing:-.5px}
.ic{fill:none;stroke:url(#ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease-out .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.line{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) .4s both;transform-origin:242.0px 0}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.spark{animation:run 5s cubic-bezier(.5,0,.5,1) 1.8s infinite;opacity:0}
@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateX(938.0px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".7"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
<radialGradient id="sp"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#F472B6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
</defs>
<rect x="8" y="14" width="46" height="46" rx="13" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
<g transform="translate(17 23) scale(1.17)"><path class="ic" pathLength="1" d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z M3 12l9 4.5 9-4.5 M3 16.5 12 21l9-4.5"/></g>
<text class="t" x="76" y="49">Projects</text>
<rect class="line" x="242.0" y="37" width="938.0" height="1.5" fill="url(#rule)"/>
<circle class="spark" cx="242.0" cy="37.7" r="6" fill="url(#sp)"/>
</svg>
