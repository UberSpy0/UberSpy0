<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Now building: taking a breath">
<title>Now building</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.k{font:500 12px 'JetBrains Mono',monospace;letter-spacing:2px;fill:#4ADE80}
.n{font:700 34px 'Space Grotesk',sans-serif;fill:#E6EAF5;letter-spacing:-.5px}
.m{font:500 13.5px 'JetBrains Mono',monospace;fill:#8A90AD}
.live{animation:live 1.6s ease-in-out infinite}
@keyframes live{50%{opacity:.35}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(3);opacity:0}}
.spark{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{opacity:0;animation:in 1s ease 1.6s forwards}
@keyframes in{to{opacity:1}}
.dot{animation:in .4s ease 2.2s both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="sl" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="sa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".3"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="188" rx="22" fill="#0C0F1E" stroke="#fff" stroke-opacity=".08"/>
<circle class="ring" cx="62" cy="50" r="4.5" fill="none" stroke="#4ADE80"/>
<circle class="live" cx="62" cy="50" r="4.5" fill="#4ADE80"/>
<text x="76" y="54" class="k">NOW BUILDING</text>

<text x="56" y="98" class="n">taking a breath</text>
<circle cx="62" cy="126" r="5" fill="#8A90AD"/>
<text x="74" y="131" class="m"><tspan fill="#E6EAF5">—</tspan>  ·  0 commits · last 14 days</text>
<text x="56" y="160" class="m"></text>
<path class="area" d="M640.0,150.0 L678.5,150.0 L716.9,102.0 L755.4,134.0 L793.8,134.0 L832.3,150.0 L870.8,150.0 L909.2,150.0 L947.7,150.0 L986.2,102.0 L1024.6,150.0 L1063.1,70.0 L1101.5,150.0 L1140.0,134.0 L1140.0,150 L640.0,150 Z" fill="url(#sa)"/>
<path class="spark" d="M640.0,150.0 L678.5,150.0 L716.9,102.0 L755.4,134.0 L793.8,134.0 L832.3,150.0 L870.8,150.0 L909.2,150.0 L947.7,150.0 L986.2,102.0 L1024.6,150.0 L1063.1,70.0 L1101.5,150.0 L1140.0,134.0" pathLength="1" fill="none" stroke="url(#sl)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="dot" cx="1140.0" cy="134.0" r="4.5" fill="#F472B6"/>
<text x="1140" y="54" text-anchor="end" class="m">14 contributions</text>
</svg>
