<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="GitHub stats for the last 12 months">
<title>GitHub stats</title>
<style>
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
.lab{font:500 13px 'JetBrains Mono',monospace;fill:#8A90AD}
.cap{font:500 13px 'JetBrains Mono',monospace;fill:#E6EAF5;letter-spacing:.5px}
.lname{font:500 15px 'JetBrains Mono',monospace;fill:#E6EAF5}
.d36 text{font:700 36px 'JetBrains Mono',monospace}
.d44 text{font:700 44px 'JetBrains Mono',monospace}
.roll{animation:roll cubic-bezier(.2,.9,.25,1) both}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(var(--to))}}
.ringdraw{stroke-dasharray:1;stroke-dashoffset:1;animation:ring 1.8s cubic-bezier(.3,.8,.3,1) .4s forwards}
@keyframes ring{to{stroke-dashoffset:var(--to)}}
.grow{animation:grow 1.2s cubic-bezier(.3,.8,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:up .7s cubic-bezier(.3,.8,.3,1) both}
@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
