<text class="b" x="32" y="132">Finds what hotel listings never mention: sea view, real quiet,</text><text class="b" x="32" y="155">beach access, mountain sun. Every fact keeps its source.</text><text class="k" x="32" y="192">MY PART</text><text class="r" x="32" y="216">Street-noise model per facade, floor and hour, checked against guest</text><text class="r" x="32" y="237">reviews. Team of 5.</text>
